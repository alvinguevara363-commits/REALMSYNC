<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealmSync — Forja tu leyenda</title>

<style>
:root {
  color-scheme: dark;
  --bg: #05080f;
  --bg-elevated: #0a101d;
  --panel: rgba(12, 19, 34, 0.92);
  --border: rgba(59, 130, 246, 0.28);
  --border-strong: rgba(59, 130, 246, 0.65);
  --text: #ffffff;
  --muted: #94a3b8;
  --blue: #2563eb;
  --blue-bright: #3b82f6;
  --blue-glow: rgba(37, 99, 235, 0.45);
  --gold: #f59e0b;
  --silver: #cbd5e1;
  --bronze: #d97706;
  --danger: #ef4444;
  --success: #10b981;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.16) 0%, transparent 55%),
    linear-gradient(180deg, #05080f 0%, #03050a 100%);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

/* Malla sutil tecnológica en negro y azul */
.grid-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-image:
    linear-gradient(to right, rgba(59, 130, 246, 0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(59, 130, 246, 0.04) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}

/* =========================================
   HEADER Y NAVEGACIÓN
   ========================================= */
header {
  background: rgba(5, 8, 15, 0.9);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(14px);
}

.nav-container {
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  gap: 16px;
}

.brand {
  display: flex;
  flex-direction: column;
}

.logo {
  font-weight: 900;
  font-size: 26px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #ffffff;
}

.logo span {
  color: var(--blue-bright);
}

.tagline {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

.tabs {
  display: flex;
  gap: 8px;
  background: var(--bg-elevated);
  padding: 5px;
  border-radius: 12px;
  border: 1px solid var(--border);
}

.tab-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 9px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.2s ease;
}

.tab-btn:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.04);
}

.tab-btn.active {
  background: var(--blue);
  color: #ffffff;
  box-shadow: 0 4px 16px var(--blue-glow);
}

/* =========================================
   CONTENEDOR PRINCIPAL
   ========================================= */
main {
  max-width: 1240px;
  margin: 32px auto;
  padding: 0 24px;
  flex: 1;
  width: 100%;
}

.view-section {
  display: none;
  animation: fadeIn 0.3s ease;
}

.view-section.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  margin-bottom: 24px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

.section-header h1,
.card-title {
  font-size: 22px;
  font-weight: 700;
  color: #ffffff;
  border-left: 4px solid var(--blue-bright);
  padding-left: 14px;
}

.badge-info {
  font-size: 12px;
  color: var(--blue-bright);
  background: rgba(37, 99, 235, 0.14);
  border: 1px solid var(--border);
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: 600;
}

/* =========================================
   FASE 1: RANKING DE SERVIDORES
   ========================================= */
.banners-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}

.banner {
  height: 125px;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 20px;
  color: #ffffff;
  position: relative;
  overflow: hidden;
  transition: all 0.25s ease;
  cursor: pointer;
  background-size: cover;
  background-position: center;
  border: 1px solid var(--border);
}

.banner span {
  font-size: 12px;
  font-weight: 500;
  color: var(--silver);
  margin-top: 4px;
}

.banner:hover {
  transform: translateY(-3px);
  border-color: var(--blue-bright);
  box-shadow: 0 8px 25px var(--blue-glow);
}

.banner::after {
  content: "PATROCINADO";
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 10px;
  font-weight: 700;
  background: rgba(5, 8, 15, 0.85);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 4px;
  color: var(--muted);
}

.server-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.server-item {
  display: flex;
  align-items: center;
  border-radius: 12px;
  padding: 18px 24px;
  transition: all 0.25s ease;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  gap: 16px;
}

.server-item:hover {
  border-color: var(--blue-bright);
  transform: translateX(4px);
  background: #0f172a;
}

.server-item.top-1 {
  border-color: rgba(245, 158, 11, 0.55);
  background: linear-gradient(90deg, rgba(245, 158, 11, 0.08), var(--bg-elevated));
}

.server-item.top-2 {
  border-color: rgba(203, 213, 225, 0.45);
}

.server-item.top-3 {
  border-color: rgba(217, 119, 6, 0.45);
}

.rank-num {
  font-weight: 900;
  font-size: 24px;
  color: var(--muted);
  width: 50px;
}

.top-1 .rank-num { color: var(--gold); }
.top-2 .rank-num { color: var(--silver); }
.top-3 .rank-num { color: var(--bronze); }

.server-info {
  flex: 1;
}

.server-info h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
  color: #ffffff;
}

.server-info p {
  color: var(--muted);
  font-size: 13px;
}

.status {
  color: var(--success);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.status::before {
  content: '';
  width: 8px;
  height: 8px;
  background: var(--success);
  border-radius: 50%;
}

.server-stats {
  text-align: right;
  margin-right: 16px;
}

.server-stats strong {
  display: block;
  font-size: 18px;
  color: #ffffff;
}

.server-stats span {
  font-size: 12px;
  color: var(--muted);
}

.btn-vote {
  background: var(--blue);
  border: 1px solid var(--blue-bright);
  color: #ffffff;
  padding: 10px 22px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-vote:hover:not(:disabled) {
  background: var(--blue-bright);
  box-shadow: 0 0 16px var(--blue-glow);
}

.btn-vote:disabled {
  background: rgba(255, 255, 255, 0.05);
  border-color: var(--border);
  color: var(--muted);
  cursor: not-allowed;
}

/* =========================================
   FASE 2: DIRECTORIO DE LA COMUNIDAD
   ========================================= */
.directory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.profile-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 26px 20px;
  text-align: center;
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.profile-card:hover {
  transform: translateY(-4px);
  border-color: var(--blue-bright);
  box-shadow: 0 1
