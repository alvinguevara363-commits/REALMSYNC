    toastElement.style.display = "block";
    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      toastElement.style.display = "none";
    }, 4200);

  function makeObjectURL(file) {
    const url = URL.createObjectURL(file);
    objectURLs.add(url);
    return url;
  }

  function releaseURL(url) {
    if (!url || !objectURLs.has(url)) return;
    URL.revokeObjectURL(url);
    objectURLs.delete(url);
  }

  function clearPendingAttachment() {
    if (!pendingAttachment) return;
    releaseURL(pendingAttachment.url);
    pendingAttachment = null;
  }

  const fileInput = document.createElement("input");

  function selectFile(kind) {
    uploadKind = kind;
    uploadOwner = currentProfile;

    fileInput.accept = kind === "video"
      ? "video/mp4,video/webm"
      : "image/jpeg,image/png,image/webp";

    fileInput.value = "";
    fileInput.click();
  }

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file || uploadOwner !== currentProfile) return;

    const isVideo = uploadKind === "video";

    const allowedTypes = isVideo
      ? ["video/mp4", "video/webm"]
      : ["image/jpeg", "image/png", "image/webp"];

    const allowedExts = isVideo
      ? ["mp4", "webm"]
      : ["jpg", "jpeg", "png", "webp"];

    const ext = (file.name.split(".").pop() || "").toLowerCase();

    const typeOk =
      allowedTypes.includes(file.type) ||
      (!file.type && allowedExts.includes(ext));

    if (!typeOk) {
      toast(
        "Formato no admitido. Usa JPG, PNG o WebP para " +
        "imágenes; MP4 o WebM para videos."
      );
      return;
    }

    const maxBytes = (isVideo ? 50 : 5) * 1024 * 1024;

    if (file.size > maxBytes) {
      toast(
        isVideo
          ? "Para esta prueba, usa un video de hasta 50 MB."
          : "Para esta prueba, usa una imagen de hasta 5 MB."
      );
      return;
    }

    const url = makeObjectURL(file);

    if (uploadKind === "avatar") {
      releaseURL(currentProfile.avatarURL);
      currentProfile.avatarURL = url;
      renderProfile();
      return;
    }

    if (uploadKind === "cover") {
      releaseURL(currentProfile.coverURL);
      currentProfile.coverURL = url;
      renderProfile();
      return;
    }

    clearPendingAttachment();
    pendingAttachment = {
      type: isVideo ? "video" : "photo",
      url,
      ownerId: currentProfile.id
    };

    if (activeTab === "Muro") {
      renderProfileContent();
      toast(`${file.name} listo. Pulsa «Publicar demo».`);
    } else {
      toast(
        `${file.name} listo. Ve al Muro para publicarlo.`
      );
    }
  });

  window.banear = function (button) {
    const row = button.closest("tr");
    if (!row) return;

    const statusCell =
      row.querySelector(".status, [data-status]") ||
      row.querySelector("td:nth-child(3)");

    if (!statusCell) return;

    const textStatus = statusCell.textContent.trim().toLowerCase();
    const wasBanned =
      row.dataset.banned === "true" ||
      textStatus === "baneado" ||
      textStatus === "banned";

    const willBan = !wasBanned;

    const name =
      row.cells[0]?.textContent.trim() ||
      row.querySelector("td")?.textContent.trim() ||
      "esta cuenta";

    const action = willBan ? "banear" : "reactivar";

    if (!confirm(`¿Confirmas ${action} a ${name} en la demo?`)) {
      return;
    }

    row.dataset.banned = String(willBan);
    statusCell.textContent = willBan ? "Baneado" : "Activo";
    statusCell.classList.toggle("is-banned", willBan);
    statusCell.classList.toggle("is-active", !willBan);

    try {
      const styles = getComputedStyle(document.documentElement);
      const danger =
        styles.getPropertyValue("--danger").trim() || "#ff6b6b";
      const success =
        styles.getPropertyValue("--success").trim() || "#4ade80";
      statusCell.style.color = willBan ? danger : success;
    } catch (_) {
      // Ignora si getComputedStyle no está disponible.
    }

    button.textContent = willBan ? "Desbanear" : "Banear";
    button.classList.toggle("btn-ban", !willBan);
    button.classList.toggle("btn-verify", willBan);
    button.style.removeProperty("color");
  };

  $$(".profile-card").forEach(card => {
    const heading =
      card.querySelector("h1, h2, h3, h4, strong, .card-title") || null;
    const headingText = (heading?.textContent || "").trim();

    const looksLikeLegendario =
      /legendario/i.test(headingText) ||
      /legendario/i.test(card.textContent);

    const mentions20 =
      /(^|[\s(])(US\$|USD|\$)\s*20(?!\d)/i.test(card.textContent);

    if (looksLikeLegendario || mentions20) {
      card.remove();
    }
  });

  const originalChatInput = document.getElementById("realm-input");

  if (originalChatInput) {
    const inlineHandler =
      (originalChatInput.getAttribute("onkeydown") || "") +
      " " +
      (originalChatInput.getAttribute("onkeypress") || "");

    const alreadyHandlesEnter = /enviarMensaje/.test(inlineHandler);

    if (!alreadyHandlesEnter && !originalChatInput.dataset.rsEnterBound) {
      originalChatInput.dataset.rsEnterBound = "true";

      originalChatInput.addEventListener("keydown", event => {
        if (
          event.key === "Enter" &&
          !event.isComposing &&
          typeof window.enviarMensaje === "function"
        ) {
          event.preventDefault();
          window.enviarMensaje();
        }
      });
    }
  }

  const originalPassword =
    document.getElementById("admin-password");

  if (originalPassword) {
    originalPassword.placeholder = "Contraseña demo: admin";
  }

  const originalAdminCard =
    document.querySelector("#admin-panel .card");

  if (originalAdminCard) {
    const warning = document.createElement("p");
    warning.className = "rs-notice";
    warning.textContent =
      "Panel de demostración: la contraseña está en el HTML. " +
      "No protege cuentas reales. Verificar y banear en esta " +
      "tabla no modifica permisos en un servidor.";

    originalAdminCard.prepend(warning);
  }

  const searchInput = $("#rs-search");
  if (searchInput) {
    searchInput.addEventListener("input", renderDirectory);
  }

  $$("[data-rs-filter]", directorySection).forEach(button => {
    button.addEventListener("click", () => {
      directoryFilter = button.dataset.rsFilter;

      $$("[data-rs-filter]", directorySection).forEach(item => {
        const selected = item === button;
        item.setAttribute("aria-pressed", String(selected));
        item.classList.toggle("rs-primary", selected);
      });

      renderDirectory();
    });
  });

  renderDirectory();
})();
</script>
